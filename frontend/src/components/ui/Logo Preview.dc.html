<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; background: #f4f6f9; }
  a { color: #21999b; text-decoration: none; }
  a:hover { color: #177475; }
</style>
</helmet>
<div style="min-height:100vh;padding:44px;box-sizing:border-box;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#1c3238">
  <div style="max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:22px">
    <div>
      <h1 style="margin:0;font-size:24px;font-weight:700;letter-spacing:-0.02em">MMS logo</h1>
      <div style="margin-top:8px;font-size:13.5px;color:#67737f">micromax-solution-mms.svg &middot; micromax-solution-mms-dark.svg &middot; mms-badge.svg &middot; mms-badge-light.svg &middot; mms-monogram.svg</div>
    </div>

    <div style="background:#fff;border:1px solid #e2e7ee;border-radius:14px;padding:34px;display:flex;align-items:center;justify-content:center">
      <svg viewBox="0 0 440 120" width="420" height="115" role="img" aria-label="MicroMax Solution MMS">
        <g transform="translate(-35.7 -25.2) scale(0.265)">
          <path d="M165 173 Q165 133 205 133 H258 V510 H205 Q165 510 165 470 Z" fill="#21999b"></path>
          <path d="M278 300 Q278 270 308 270 H365 V510 H278 Z" fill="#21999b"></path>
          <path d="M383 352 H425 Q470 352 470 397 V465 Q470 510 425 510 H383 Z" fill="#21999b"></path>
          <g fill="#ef5f21">
            <path d="M445 246 L470 246 L449 280 L466 280 L423 324 L437 289 L420 289 Z"></path>
          </g>
        </g>
        <text x="112" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.6" fill="#1c3238">Micro<tspan fill="#21999b">Max</tspan></text>
        <text x="113" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="4.6" fill="#4c5c63">SOLUTION</text>
      </svg>
    </div>

    <div style="background:#0f1720;border:1px solid #1c2836;border-radius:14px;padding:34px;display:flex;align-items:center;justify-content:center">
      <svg viewBox="0 0 440 120" width="420" height="115" role="img" aria-label="MicroMax Solution MMS on dark">
        <g transform="translate(-35.7 -25.2) scale(0.265)">
          <path d="M165 173 Q165 133 205 133 H258 V510 H205 Q165 510 165 470 Z" fill="#21999b"></path>
          <path d="M278 300 Q278 270 308 270 H365 V510 H278 Z" fill="#21999b"></path>
          <path d="M383 352 H425 Q470 352 470 397 V465 Q470 510 425 510 H383 Z" fill="#21999b"></path>
          <g fill="#ef5f21">
            <path d="M445 246 L470 246 L449 280 L466 280 L423 324 L437 289 L420 289 Z"></path>
          </g>
        </g>
        <text x="112" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.6" fill="#ffffff">Micro<tspan fill="#21999b">Max</tspan></text>
        <text x="113" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="4.6" fill="#93a4b7">SOLUTION</text>
      </svg>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px">
      <div style="background:#fff;border:1px solid #e2e7ee;border-radius:14px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:18px">
        <svg viewBox="0 0 256 256" width="150" height="150" role="img" aria-label="MMS dark badge">
          <rect width="256" height="256" rx="56" fill="#0b1c25"></rect>
          <g transform="translate(38 -14) scale(0.72)">
            <path d="M24 76 Q24 60 40 60 H58 V196 H40 Q24 196 24 180 Z" fill="#21999b"></path>
            <path d="M72 120 Q72 106 86 106 H104 V196 H72 Z" fill="#21999b"></path>
            <path d="M118 140 H136 Q158 140 158 162 V174 Q158 196 136 196 H118 Z" fill="#21999b"></path>
            <g fill="#ef5f21">
              <path d="M148 86 L165 86 L150 110 L162 110 L133 141 L142 117 L131 117 Z"></path>
            </g>
          </g>
          <text x="128" y="228" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="4" fill="#e6edf5">MMS</text>
        </svg>
        <span style="font-size:12.5px;color:#67737f">Dark badge</span>
      </div>

      <div style="background:#0f1720;border:1px solid #1c2836;border-radius:14px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:18px">
        <svg viewBox="0 0 256 256" width="150" height="150" role="img" aria-label="MMS light badge">
          <rect width="256" height="256" rx="56" fill="#ffffff"></rect>
          <g transform="translate(38 -14) scale(0.72)">
            <path d="M24 76 Q24 60 40 60 H58 V196 H40 Q24 196 24 180 Z" fill="#21999b"></path>
            <path d="M72 120 Q72 106 86 106 H104 V196 H72 Z" fill="#21999b"></path>
            <path d="M118 140 H136 Q158 140 158 162 V174 Q158 196 136 196 H118 Z" fill="#21999b"></path>
            <g fill="#ef5f21">
              <path d="M148 86 L165 86 L150 110 L162 110 L133 141 L142 117 L131 117 Z"></path>
            </g>
          </g>
          <text x="128" y="228" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="4" fill="#1c3238">MMS</text>
        </svg>
        <span style="font-size:12.5px;color:#93a4b7">Light badge</span>
      </div>

      <div style="background:#fff;border:1px solid #e2e7ee;border-radius:14px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:18px">
        <svg viewBox="0 0 256 256" width="150" height="150" role="img" aria-label="MMS monogram">
          <rect width="256" height="256" rx="56" fill="#21999b"></rect>
          <text x="128" y="150" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="-2" fill="#ffffff">MMS</text>
          <g fill="#ef5f21" transform="translate(0 26)">
            <path d="M132 135 L149 135 L134 158 L146 158 L117 189 L126 165 L115 165 Z"></path>
          </g>
        </svg>
        <span style="font-size:12.5px;color:#67737f">Monogram</span>
      </div>
    </div>

    <div style="background:#fff;border:1px solid #e2e7ee;border-radius:14px;padding:26px;display:flex;align-items:center;gap:34px;flex-wrap:wrap">
      <div style="font-size:12.5px;color:#67737f;min-width:110px">Small sizes</div>
      <svg viewBox="0 0 256 256" width="56" height="56" role="img" aria-label="MMS badge 56">
        <rect width="256" height="256" rx="56" fill="#0b1c25"></rect>
        <g transform="translate(38 -14) scale(0.72)">
          <path d="M24 76 Q24 60 40 60 H58 V196 H40 Q24 196 24 180 Z" fill="#21999b"></path>
          <path d="M72 120 Q72 106 86 106 H104 V196 H72 Z" fill="#21999b"></path>
          <path d="M118 140 H136 Q158 140 158 162 V174 Q158 196 136 196 H118 Z" fill="#21999b"></path>
          <g fill="#ef5f21">
            <path d="M148 86 L165 86 L150 110 L162 110 L133 141 L142 117 L131 117 Z"></path>
          </g>
        </g>
        <text x="128" y="228" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="4" fill="#e6edf5">MMS</text>
      </svg>
      <svg viewBox="0 0 256 256" width="34" height="34" role="img" aria-label="MMS monogram 34">
        <rect width="256" height="256" rx="56" fill="#21999b"></rect>
        <text x="128" y="150" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="-2" fill="#ffffff">MMS</text>
        <g fill="#ef5f21" transform="translate(0 26)">
          <path d="M132 135 L149 135 L134 158 L146 158 L117 189 L126 165 L115 165 Z"></path>
        </g>
      </svg>
      <svg viewBox="0 0 256 256" width="24" height="24" role="img" aria-label="MMS monogram 24">
        <rect width="256" height="256" rx="56" fill="#21999b"></rect>
        <text x="128" y="150" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="-2" fill="#ffffff">MMS</text>
        <g fill="#ef5f21" transform="translate(0 26)">
          <path d="M132 135 L149 135 L134 158 L146 158 L117 189 L126 165 L115 165 Z"></path>
        </g>
      </svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
